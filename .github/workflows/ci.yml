name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Un BOM al principio de una migración rompe `supabase db reset` con un
      # error de sintaxis desconcertante; ya pasó una vez con el catálogo de
      # recetas y solo lo evitaba la disciplina del editor (auditoría
      # 2026-07-29).
      - name: Check migrations have no BOM
        run: |
          if grep -rlI $'\xef\xbb\xbf' supabase/migrations; then
            echo "Hay migraciones con BOM (ver lista arriba); guárdalas como UTF-8 sin BOM."
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Test
        run: npx vitest run
